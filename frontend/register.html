<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSO Admin Registration</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <main class="auth-container">
    <div class="auth-card">

      <h1>Create RSO Admin Account</h1>
      <p class="auth-subtitle">
        Register an administrator for your student organization.
      </p>

      <form id="registerForm">

        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
          >
        </div>

        <div class="form-group">
          <label for="rsoName">Student Club / RSO Name</label>
          <input
            type="text"
            id="rsoName"
            name="rsoName"
            placeholder="Enter your student club name"
            required
          >
        </div>

        <button type="submit" class="primary-btn">
          Register
        </button>

      </form>

      <p id="errorMsg" class="error-message"></p>
      <p id="successMsg" class="success-message"></p>

      <p class="auth-link">
        Already have an account?
        <a href="index.html">Login</a>
      </p>

    </div>
  </main>

  <script src="js/auth.js"></script>

</body>
</html>
